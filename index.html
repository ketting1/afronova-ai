<!DOCTYPE html>
<html>

<head>

  <title>AfroNova AI</title>

  <style>

    body{
      background:linear-gradient(to bottom, black, darkblue);
      color:white;
      text-align:center;
      font-family:Arial;
      padding-top:100px;
    }

    h1{
      font-size:60px;
      color:cyan;
    }

    p{
      font-size:24px;
    }

    input{
      padding:15px;
      width:300px;
      border:none;
      border-radius:10px;
    }

    button{
      padding:15px 25px;
      border:none;
      border-radius:10px;
      background:cyan;
      font-size:18px;
      cursor:pointer;
    }

    #response{
      margin-top:40px;
      font-size:24px;
      color:gold;
    }

  </style>

</head>

<body>

  <h1>AFRONOVA AI</h1>

  <p>Ask the AI something</p>

  <input type="text"
  id="question"
  placeholder="Type here">

  <br><br>

  <button onclick="reply()">Ask AI</button>

  <div id="response"></div>

  <script>

    function reply(){

      let answer =
      "The future belongs to creators.";

      document.getElementById("response").innerHTML =
      answer;

    }

  </script>

</body>

</html>
